<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | PropertiesNexus</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><main class="page"><section class="visual"><a class="brand" href="index.html"><span class="mark"><i></i><i></i><i></i></span>Properties<span>Nexus</span></a><div class="visual-copy"><p class="eyebrow">Account recovery</p><h1>We’ll help you find your way <em>back.</em></h1><p>Request a secure password reset link. It expires automatically for your protection.</p></div></section><section class="auth"><div class="box"><a class="back" href="login.html">← Back to sign in</a><h2>Reset your password</h2><p class="sub">Enter the email address linked to your account.</p><form id="form"><label class="field"><span>Email address</span><input id="email" type="email" required placeholder="you@example.com"></label><button class="primary" id="submit">Send reset link</button><p class="message" id="message" aria-live="polite"></p></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script><script>const $=x=>document.querySelector(x);$('#form').onsubmit=async e=>{e.preventDefault();let b=$('#submit'),m=$('#message');try{b.disabled=true;b.textContent='Sending…';const {error}=await PNAuth.client().auth.resetPasswordForEmail($('#email').value,{redirectTo:location.origin+location.pathname.replace('forgot-password.html','reset-password.html')});if(error)throw error;PNAuth.message(m,'If an account exists, a secure reset link is on its way.')}catch(err){PNAuth.message(m,err.message,'error')}finally{b.disabled=false;b.textContent='Send reset link'}};</script></body></html>
