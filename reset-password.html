<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose new password | PropertiesNexus</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><main class="page"><section class="visual"><a class="brand" href="index.html"><span class="mark"><i></i><i></i><i></i></span>Properties<span>Nexus</span></a><div class="visual-copy"><p class="eyebrow">Secure account recovery</p><h1>Set a password that feels <em>new.</em></h1><p>Choose a strong password with at least eight characters.</p></div></section><section class="auth"><div class="box"><a class="back" href="login.html">← Back to sign in</a><h2>Create a new password</h2><p class="sub">Your reset link has securely identified your account.</p><form id="form"><label class="field"><span>New password</span><input id="password" type="password" minlength="8" required placeholder="At least 8 characters"></label><label class="field"><span>Confirm new password</span><input id="confirm" type="password" minlength="8" required placeholder="Repeat new password"></label><button class="primary" id="submit">Save new password</button><p class="message" id="message" aria-live="polite"></p></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script><script>const $=x=>document.querySelector(x);$('#form').onsubmit=async e=>{e.preventDefault();let b=$('#submit'),m=$('#message');try{if($('#password').value!==$('#confirm').value)throw new Error('The passwords do not match.');b.disabled=true;b.textContent='Saving…';const {error}=await PNAuth.client().auth.updateUser({password:$('#password').value});if(error)throw error;PNAuth.message(m,'Password updated. You can sign in now.');setTimeout(()=>PNAuth.redirect('login.html'),1000)}catch(err){PNAuth.message(m,err.message,'error')}finally{b.disabled=false;b.textContent='Save new password'}};</script></body></html>
