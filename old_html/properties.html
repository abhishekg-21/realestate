</style></head><body><header class="wrap nav"><a class="logo" href="index.html"><span class="mark"><i></i><i></i><i></i></span>Properties<span>Nexus</span></a><nav class="links"><a href="properties.html">Map</a><a href="properties.html">Properties</a><a href="index.html#agents">For partners</a></nav><div class="right"><a href="login.html">Log in</a><a href="register.html">Create account</a><a href="business-signup.html">List property</a></div></header><main class="wrap"><div class="head"><div><h1>Explore properties</h1><p>Thoughtfully selected homes and spaces across India.</p></div><button class="reset" id="resetTop">Reset all filters</button></div><div class="mobile-filter"><button id="mobileOpen">☷ Filters</button><button id="mobileSort">Sort: newest</button></div><div class="layout"><aside class="filter" id="filter"><div class="filter-top"><b>Filters</b><button id="clear">Clear all</button></div><div class="field"><b>Search location or property</b><input id="query" placeholder="City, area, property name"></div><div class="field"><b>Purpose</b><label class="check"><input type="checkbox" name="purpose" value="Buy"> Buy</label><label class="check"><input type="checkbox" name="purpose" value="Rent"> Rent</label></div><div class="field"><b>Property type</b><label class="check"><input type="checkbox" name="type" value="Apartment"> Apartments</label><label class="check"><input type="checkbox" name="type" value="Villa"> Villas</label><label class="check"><input type="checkbox" name="type" value="Office"> Offices</label><label class="check"><input type="checkbox" name="type" value="Plot"> Plots</label></div><div class="field"><b>Price range</b><div class="range"><input id="minPrice" inputmode="numeric" placeholder="Min ₹"><input id="maxPrice" inputmode="numeric" placeholder="Max ₹"></div></div><div class="field"><b>Bedrooms</b><select id="beds"><option value="">Any</option><option value="1">1+ beds</option><option value="2">2+ beds</option><option value="3">3+ beds</opti const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const cards=$('#cards');function price(v){return Number(String(v).replace(/[^0-9]/g,''))||0}function filters(){let q=$('#query').value.toLowerCase(),pur=$$('input[name=purpose]:checked').map(x=>x.value),typ=$$('input[name=type]:checked').map(x=>x.value),min=price($('#minPrice').value),max=price($('#maxPrice').value),beds=+$('#beds').value;let out=PROPERTIES.filter(p=>(!q||[p.title,p.city,p.area,p.type].join(' ').toLowerCase().includes(q))&&(!pur.length||pur.includes(p.purpose))&&(!typ.length||typ.includes(p.type))&&(!min||p.price>=min)&&(!max||p.price<=max)&&(!beds||p.beds>=beds));let sort=$('#sort').value;if(sort==='low')out.sort((a,b)=>a.price-b.price);if(sort==='high')out.sort((a,b)=>b.price-a.price);return out}function render(){let out=filters();$('#count').textContent=out.length+' '+(out.length===1?'property':'properties')+' found';cards.innerHTML=out.length?out.map(p=>`<article class="card"><a class="image" href="property.html?id=${p.id}" style="background-image:url('${p.image}')"><span class="tag">${p.tag}</span></a><button class="save" aria-label="Save ${p.title}">♡</button><a class="body" href="property.html?id=${p.id}"><span class="purpose">${p.purpose} · ${p.type}</span><div class="price">${p.displayPrice}</div><h2>${p.title}</h2><span class="area">${p.area}, ${p.city}</span><div class="meta"><span>${p.beds?p.beds+' Bed · ':''}${p.baths?p.baths+' Bath':''}</span><span>${p.areaSq}</span></div></a></article>`).join(''):'<div class="empty">No properties match those filters.<br><br><button id="emptyReset">Clear filters</button></div>';$$('.save').forEach(b=>b.onclick=(e)=>{e.preventDefault();b.textContent=b.textContent==='♡'?'♥':'♡'});let e=$('#emptyReset');if(e)e.onclick=reset}function reset(){$('#query').value='';$('#minPrice').value='';$('#maxPrice').value='';$('#beds').value='';$$('input[type=checkbox]').forEach(x=>x.checked=false);render()}$('#apply').onclick=()=>{$('#filter').classList.remove('open');render()};$('#clear').onclick=reset;$('#resetTop').onclick=reset;$('#sort').onchange=render;$('#mobileOpen').onclick=()=>$('#filter').classList.add('open');$('#mobileSort').onclick=()=>{$('#sort').value=$('#sort').value==='new'?'low':$('#sort').value==='low'?'high':'new';$('#mobileSort').textContent='Sort: '+$('#sort').selectedOptions[0].text;render()};['query','minPrice','maxPrice','beds'].forEach(x=>$('#'+x).addEventListener('input',render));$$('input[type=checkbox]').forEach(x=>x.onchange=render);

const params=new URLSearchParams(location.search);

if(params.get('type')){let t=params.get('type');$$('input[name=type]').forEach(x=>{if(x.value.toLowerCase()===t.toLowerCase())x.checked=true;});}
