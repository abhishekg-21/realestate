<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Property | PropertiesNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #07182d;
        --ink: #152230;
        --muted: #687783;
        --gold: #c78a2d;
        --line: #dfe4e7;
        --soft: #f5f7f7;
        --green: #078f5a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        color: var(--ink);
        background: #fff;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      .wrap {
        width: min(1200px, calc(100% - 48px));
        margin: auto;
      }
      .nav {
        height: 80px;
        display: flex;
        align-items: center;
        gap: 25px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        display: flex;
        align-items: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .logo span {
        font-weight: 400;
        color: #697886;
      }
      .mark {
        display: inline-flex;
        align-items: end;
        gap: 2px;
        margin-right: 8px;
        height: 21px;
      }
      .mark i {
        display: block;
        width: 4px;
        background: var(--gold);
      }
      .mark i:nth-child(1) {
        height: 10px;
      }
      .mark i:nth-child(2) {
        height: 18px;
      }
      .mark i:nth-child(3) {
        height: 14px;
      }
      .links {
        border-left: 1px solid var(--line);
        padding-left: 25px;
        display: flex;
        gap: 26px;
        font-size: 13px;
        font-weight: 600;
        color: #596875;
      }
      .right {
        margin-left: auto;
        display: flex;
        gap: 9px;
      }
      .right a {
        border: 1px solid var(--line);
        border-radius: 22px;
        font-size: 12px;
        font-weight: 700;
        padding: 10px 14px;
      }
      .right a:last-child {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      main {
        padding: 26px 0 80px;
      }
      .back {
        font-size: 12px;
        color: #657480;
      }
      .gallery {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        grid-template-rows: 205px 205px;
        gap: 8px;
        margin-top: 20px;
      }
      .gallery button {
        border: 0;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        position: relative;
      }
      .gallery button:first-child {
        grid-row: 1/3;
      }
      .gallery button:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent, rgba(3, 18, 35, 0.15));
        opacity: 0;
        transition: 0.2s;
      }
      .gallery button:hover:after {
        opacity: 1;
      }
      .content {
        display: grid;
        grid-template-columns: 1fr 355px;
        gap: 75px;
        margin-top: 38px;
      }
      .kind {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--green);
      }
      h1 {
        font-family: "Playfair Display", serif;
        font-size: 48px;
        letter-spacing: -2px;
        font-weight: 500;
        line-height: 1.08;
        margin: 9px 0;
      }
      .location {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }
      .price {
        font-family: "Playfair Display", serif;
        font-size: 31px;
        margin: 26px 0 19px;
      }
      .facts {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 19px 0;
        display: flex;
        gap: 36px;
      }
      .facts div {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .facts b {
        font-size: 14px;
      }
      .facts span {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
      }
      .section {
        padding: 30px 0;
        border-bottom: 1px solid var(--line);
      }
      .section h2 {
        font-family: "Playfair Display", serif;
        font-size: 27px;
        font-weight: 500;
        margin: 0 0 13px;
      }
      .section p {
        font-size: 14px;
        color: #586875;
        line-height: 1.8;
        margin: 0;
      }
      .amenities {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .amenities span {
        font-size: 13px;
        color: #485866;
      }
      .amenities span:before {
        content: "✓";
        color: var(--green);
        margin-right: 9px;
      }
      .contact {
        height: max-content;
        border: 1px solid var(--line);
        padding: 24px;
        position: sticky;
        top: 20px;
      }
      .contact h2 {
        font-family: "Playfair Display", serif;
        font-size: 25px;
        font-weight: 500;
        margin: 0 0 7px;
      }
      .contact p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
      }
      .field {
        display: block;
        margin: 13px 0;
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid #dbe1e4;
        border-radius: 7px;
        padding: 11px;
        font-size: 12px;
        resize: vertical;
      }
      .inquire {
        border: 0;
        background: var(--navy);
        color: #fff;
        width: 100%;
        padding: 13px;
        border-radius: 7px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
      }
      .whatsapp {
        display: block;
        background: #ecf8f1;
        color: #087c4f;
        text-align: center;
        padding: 12px;
        border-radius: 7px;
        font-weight: 700;
        font-size: 12px;
        margin-top: 10px;
      }
      .fine {
        font-size: 10px !important;
      }
      .message {
        font-size: 11px !important;
        color: #087c4f !important;
        text-align: center;
        min-height: 17px;
      }
      .modal {
        position: fixed;
        z-index: 20;
        inset: 0;
        background: rgba(2, 14, 28, 0.88);
        display: none;
        place-items: center;
        padding: 30px;
      }
      .modal.open {
        display: grid;
      }
      .modal img {
        max-width: min(100%, 1100px);
        max-height: 85vh;
      }
      .modal button {
        position: absolute;
        top: 20px;
        right: 25px;
        border: 0;
        background: #fff;
        border-radius: 50%;
        width: 37px;
        height: 37px;
        font-size: 20px;
        cursor: pointer;
      }
      @media (max-width: 850px) {
        .wrap {
          width: min(100% - 32px, 1200px);
        }
        .nav {
          height: 67px;
        }
        .links,
        .right a:first-child {
          display: none;
        }
        .right {
          margin-left: auto;
        }
        .right a:last-child {
          font-size: 11px;
          padding: 9px 11px;
        }
        main {
          padding-top: 18px;
        }
        .gallery {
          grid-template-columns: 1fr 1fr;
          grid-template-rows: 190px 95px;
        }
        .content {
          grid-template-columns: 1fr;
          gap: 30px;
          margin-top: 28px;
        }
        h1 {
          font-size: 38px;
        }
        .facts {
          gap: 18px;
          justify-content: space-between;
        }
        .facts b {
          font-size: 12px;
        }
        .contact {
          position: static;
        }
        .modal {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <header class="wrap nav">
      <a class="logo" href="index.html"
        ><span class="mark"><i></i><i></i><i></i></span>Properties<span
          >Nexus</span
        ></a
      >
      <nav class="links">
        <a href="properties.html">Map</a><a href="properties.html">Properties</a
        ><a href="index.html#agents">For partners</a>
      </nav>
      <div class="right">
        <a href="login.html">Log in</a
        ><a href="business-signup.html">List property</a>
      </div>
    </header>
    <main class="wrap">
      <a class="back" href="properties.html">← Back to all properties</a>
      <div class="gallery" id="gallery"></div>
      <div class="content">
        <section id="detail"></section>
        <aside class="contact">
          <h2>Interested in this property?</h2>
          <p>
            Our local advisor will share availability, arrange a viewing and
            answer your questions.
          </p>
          <form id="inquiry">
            <label class="field"
              ><input required placeholder="Your name" /></label
            ><label class="field"
              ><input type="tel" required placeholder="Phone number" /></label
            ><label class="field">
              <textarea
                rows="3"
                placeholder="I would like to know more about this property."
              ></textarea></label
            ><button class="inquire">Request a call back</button>
            <p class="message" id="message" aria-live="polite"></p>
          </form>
          <a class="whatsapp" id="whatsapp" target="_blank"
            >WhatsApp an advisor</a
          >
          <p class="fine">
            By submitting, you agree to be contacted about this property.
          </p>
        </aside>
      </div>
    </main>
    <div class="modal" id="modal">
      <button id="close">×</button><img id="modalImage" alt="Property photo" />
    </div>
    <script src="properties-data.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id");
      const p = PROPERTIES.find((x) => x.id === id) || PROPERTIES[0];
      document.title = p.title + " | PropertiesNexus";
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = p.images
        .map(
          (x, i) =>
            `<button style="background-image:url('${x}')" data-img="${x}" aria-label="View property image ${i + 1}"></button>`,
        )
        .join("");
      document.getElementById("detail").innerHTML =
        `<span class="kind">${p.purpose} · ${p.type}</span><h1>${p.title}</h1><p class="location">${p.area}, ${p.city}</p><div class="price">${p.displayPrice}</div><div class="facts"><div><b>${p.beds || "—"}</b><span>Bedrooms</span></div><div><b>${p.baths || "—"}</b><span>Bathrooms</span></div><div><b>${p.areaSq}</b><span>Built-up area</span></div></div><div class="section"><h2>About this property</h2><p>${p.description}</p></div><div class="section"><h2>Highlights</h2><div class="amenities">${p.amenities.map((x) => "<span>" + x + "</span>").join("")}</div></div><div class="section"><h2>Location</h2><p>Explore the neighbourhood with a private guided viewing. Exact address and access details are shared after your enquiry.</p></div>`;
      document.getElementById("whatsapp").href =
        "https://wa.me/919136331992?text=" +
        encodeURIComponent(
          "Hi, I am interested in " + p.title + " in " + p.city + ".",
        );
      document.querySelectorAll("#gallery button").forEach(
        (b) =>
          (b.onclick = () => {
            document.getElementById("modalImage").src = b.dataset.img;
            document.getElementById("modal").classList.add("open");
          }),
      );
      document.getElementById("close").onclick = () =>
        document.getElementById("modal").classList.remove("open");
      document.getElementById("modal").onclick = (e) => {
        if (e.target.id === "modal") e.currentTarget.classList.remove("open");
      };
      document.getElementById("inquiry").onsubmit = (e) => {
        e.preventDefault();
        document.getElementById("message").textContent =
          "Thank you — an advisor will contact you shortly.";
      };
    </script>
  </body>
</html>
